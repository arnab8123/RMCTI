<!doctype html><html lang="en"><head><link rel="icon" href="/favicon.ico"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RMCTI · Save Work</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/global.css"></head><body data-role="student"><div class="app"><aside class="side"><div class="brand"><img class="brandlogo" src="../asset/image.png" alt="RMCTI logo"><span>RMCTI</span></div><nav class="nav"><a href="dashboard.html">⌂ Dashboard</a><a href="routine.html">▦ Weekly Routine</a><a href="homework.html">✓ Homework</a><a href="classwork.html">▣ Classwork</a><a href="save-work.html">📝 Save Work</a><a href="notice-board.html">📌 Notice Board</a><button type="button" data-theme>◐ Theme</button><button type="button" data-logout>↪ Logout</button></nav></aside><main class="main"><header class="top"><div><button class="btn secondary menu" data-menu>☰</button> <b>Save Work</b></div><span class="muted" data-user></span></header><section class="content"><h1>Save Work</h1><p class="muted">Keep class notes, homework drafts and study files here. Only you can view your saved work.</p><div class="card pad"><form id="work-form" class="form"><input type="hidden" name="id"><div class="full"><label class="label">Title *</label><input class="input" name="title" required maxlength="255" placeholder="e.g. Digital Electronics — K-map notes"></div><div class="full"><label class="label">Notes / class work</label><textarea class="input" name="content" rows="7" placeholder="Write or paste your work here…"></textarea></div><div class="full"><label class="label">Attach a file (optional, max 15 MB)</label><input class="input" name="file" type="file" accept=".pdf,.txt,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.jpg,.jpeg,.png,.webp"></div><div class="full" style="display:flex;gap:8px"><button class="btn primary" type="submit">Save Work</button><button class="btn secondary" type="button" id="clear">New / Clear</button></div></form></div><div class="card pad" style="margin-top:16px"><h3>My Saved Work</h3><div id="saved-list">Loading…</div></div></section></main></div><script src="../js/theme.js"></script><script src="../js/api.js"></script><script src="../js/utils.js"></script><script src="../js/auth.js"></script><script src="../js/app.js"></script><script>
(async()=>{const form=document.getElementById('work-form'),list=document.getElementById('saved-list');let items=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function reset(){form.reset();form.elements.id.value=''}function draw(){list.innerHTML=items.map(x=>`<article class="card pad" style="margin:10px 0"><div style="display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap"><div><h3>${esc(x.title)}</h3><div class="muted">Updated ${esc(x.updated_at||'')}</div></div><div style="display:flex;gap:8px;align-items:start"><button class="btn secondary small" data-edit="${x.id}">Edit</button>${x.filename?`<button class="btn secondary small" data-file="${x.id}">Download ${esc(x.filename)}</button>`:''}<button class="btn danger small" data-delete="${x.id}">Delete</button></div></div><p style="white-space:pre-wrap">${esc(x.content||'')}</p></article>`).join('')||'<div class="empty">No saved work yet. Add your first note above.</div>'}async function load(){try{items=await Api.get('/student/saved-work');draw()}catch(e){list.textContent=e.message}}form.addEventListener('submit',async e=>{e.preventDefault();const btn=form.querySelector('[type=submit]');btn.disabled=true;try{const id=form.elements.id.value,file=form.elements.file.files[0];if(file){const fd=new FormData();fd.append('title',form.elements.title.value);fd.append('content',form.elements.content.value);fd.append('file',file);const token=localStorage.getItem('rmcti_token')||sessionStorage.getItem('token');const res=await fetch('/api/student/saved-work',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});const data=await res.json();if(!res.ok||data.success===false)throw Error(data.message||'Could not save work')}else if(id){await Api.put('/student/saved-work/'+id,{title:form.elements.title.value,content:form.elements.content.value})}else{const fd=new FormData();fd.append('title',form.elements.title.value);fd.append('content',form.elements.content.value);const token=localStorage.getItem('rmcti_token')||sessionStorage.getItem('token');const res=await fetch('/api/student/saved-work',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});const data=await res.json();if(!res.ok||data.success===false)throw Error(data.message||'Could not save work')}reset();await load()}catch(err){alert(err.message)}finally{btn.disabled=false}});list.addEventListener('click',async e=>{const edit=e.target.closest('[data-edit]')?.dataset.edit,del=e.target.closest('[data-delete]')?.dataset.delete,file=e.target.closest('[data-file]')?.dataset.file;if(edit){const x=items.find(a=>a.id===Number(edit));if(x){form.elements.id.value=x.id;form.elements.title.value=x.title;form.elements.content.value=x.content||'';form.scrollIntoView({behavior:'smooth',block:'start'})}}if(del&&confirm('Delete this saved work?')){try{await Api.del('/student/saved-work/'+del);await load()}catch(err){alert(err.message)}}if(file){try{const token=localStorage.getItem('rmcti_token')||sessionStorage.getItem('token');const res=await fetch('/api/student/saved-work/'+file+'/download',{headers:{Authorization:'Bearer '+token}});if(!res.ok)throw Error('Could not download file');const blob=await res.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=items.find(x=>x.id===Number(file))?.filename||'saved-work';a.click();URL.revokeObjectURL(url)}catch(err){alert(err.message)}}});document.getElementById('clear').onclick=reset;await load()})();</script></body></html>
