<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RMCTI · All Files</title><link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/global.css">
  <style>
    .fm-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}.fm-head h1{margin:0 0 5px}.fm-tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.fm-search{min-width:min(330px,100%);max-width:420px}.fm-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.fm-stat{padding:12px 15px;border:1px solid var(--border);border-radius:12px;background:var(--surface);min-width:120px}.fm-stat b{display:block;font-size:21px}.fm-stat span{font-size:12px;color:var(--muted)}.fm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.fm-file{position:relative;min-width:0;padding:13px;border:1px solid var(--border);border-radius:15px;background:var(--surface);box-shadow:var(--shadow);transition:transform .16s,border-color .16s,box-shadow .16s}.fm-file:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:0 12px 28px rgba(15,23,42,.12)}.fm-preview{height:116px;border-radius:10px;background:var(--muted-surface);display:grid;place-items:center;overflow:hidden;margin-bottom:12px;position:relative}.fm-preview img{width:100%;height:100%;object-fit:contain;background:var(--muted-surface)}.fm-ext{font-size:34px;font-weight:850;letter-spacing:-1px;color:var(--primary);text-transform:uppercase}.fm-file-icon{font-size:39px;line-height:1}.fm-file-name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}.fm-file-title{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}.fm-meta{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:11px;color:var(--muted)}.fm-badge{display:inline-flex;max-width:100%;padding:4px 7px;border-radius:7px;background:var(--muted-surface);font-size:10px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fm-actions{display:flex;gap:6px;margin-top:12px}.fm-actions .btn{flex:1;margin:0;padding:8px 7px;font-size:12px}.fm-empty{grid-column:1/-1;text-align:center;padding:44px 16px;border:1px dashed var(--border);border-radius:15px;color:var(--muted)}.fm-empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:5px}.fm-toolbar-card{padding:14px;margin-bottom:16px}.fm-error{grid-column:1/-1;padding:20px;border:1px solid var(--danger);border-radius:12px;color:var(--danger)}
    @media(max-width:560px){.fm-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.fm-file{padding:9px}.fm-preview{height:88px}.fm-search{min-width:100%;max-width:none}.fm-tools{width:100%}.fm-tools .btn{flex:1}.fm-file-name{font-size:13px}.fm-actions{flex-direction:column}}
  </style>
</head>
<body data-role="admin">
  <div class="app"><aside class="side"><div class="brand"><img class="brandlogo" src="../asset/image.png" alt="RMCTI logo"><span>RMCTI</span></div><nav class="nav"><a href="dashboard.html">⌂ Dashboard</a><a href="attachments.html">📎 Attach File</a><a href="all-files.html">🗂 All Files</a><a href="students.html">♧ Students</a><a href="teachers.html">♙ Teachers</a><button type="button" data-theme>◐ Theme</button><button type="button" data-logout>↪ Logout</button></nav></aside>
  <main class="main"><header class="top"><div><button type="button" class="btn secondary menu" data-menu aria-label="Open navigation" aria-expanded="false">☰</button> <b>All Files</b></div><span class="muted" data-user></span></header>
  <section class="content"><div class="fm-head"><div><h1>All Files</h1><p class="muted" style="margin:0">Browse uploaded RMCTI files in a compact file-manager layout.</p></div><div class="fm-tools"><button class="btn secondary" id="refresh">↻ Refresh</button></div></div>
  <div class="fm-summary"><div class="fm-stat"><b id="total-count">—</b><span>All files</span></div><div class="fm-stat"><b id="r2-count">—</b><span>Stored in R2</span></div><div class="fm-stat"><b id="total-size">—</b><span>Total listed size</span></div></div>
  <div class="card fm-toolbar-card"><div class="fm-tools"><input class="input fm-search" id="search" type="search" placeholder="Search files, extensions, titles…" aria-label="Search files"><select class="select" id="type-filter" style="width:auto;min-width:150px"><option value="">All file types</option><option value="image">Images</option><option value="pdf">PDFs</option><option value="document">Documents</option><option value="student">Student work</option><option value="r2">Cloudflare R2</option></select><span class="muted" id="count" aria-live="polite"></span></div></div>
  <div id="files" class="fm-grid" aria-live="polite"><div class="fm-empty"><strong>Loading files…</strong>Please wait.</div></div>
  </section></main></div>
  <script src="../js/theme.js"></script><script src="../js/api.js"></script><script src="../js/utils.js"></script><script src="../js/auth.js"></script><script src="../js/app.js"></script>
  <script>
  (async()=>{
    const grid=document.getElementById('files'),search=document.getElementById('search'),filter=document.getElementById('type-filter'),count=document.getElementById('count');let rows=[];
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const size=n=>{n=Number(n)||0;return n<1024?`${n} B`:n<1048576?`${(n/1024).toFixed(1)} KB`:`${(n/1048576).toFixed(2)} MB`};
    const ext=x=>{const n=String(x.name||'').split('.').pop();return n&&n!==x.name&&n.length<=6?n.toUpperCase():(String(x.mime_type||'').split('/').pop()||'FILE').slice(0,5).toUpperCase()};
    const kind=x=>{const t=String(x.type||'').toLowerCase(),m=String(x.mime_type||'').toLowerCase(),n=String(x.name||'').toLowerCase();if(t.includes('student'))return 'student';if(t.includes('photo')||t.includes('image')||m.startsWith('image/'))return 'image';if(m==='application/pdf'||n.endsWith('.pdf'))return 'pdf';if(/document|spreadsheet|presentation|text|csv/.test(m)||/\.(docx?|xlsx?|pptx?|txt|csv)$/.test(n))return 'document';return 'other'};
    function draw(){const q=search.value.trim().toLowerCase(),f=filter.value;const a=rows.filter(x=>[x.name,x.title,x.type,x.mime_type,x.storage].join(' ').toLowerCase().includes(q)&&(!f||(f==='r2'?String(x.storage).toLowerCase().includes('r2'):kind(x)===f)));count.textContent=`${a.length} shown`;
      grid.innerHTML=a.map(x=>{const k=kind(x),image=k==='image'&&String(x.download_url||'').includes('/uploads/photos/');const preview=image?`<img loading="lazy" src="${esc(x.download_url)}" alt="${esc(x.name)}" onerror="this.outerHTML='<span class=&quot;fm-file-icon&quot;>🖼️</span>'">`:`<span class="${k==='image'?'fm-file-icon':'fm-ext'}">${k==='image'?'🖼️':k==='pdf'?'PDF':k==='document'?'DOC':k==='student'?'📝':ext(x)}</span>`;return `<article class="fm-file"><div class="fm-preview">${preview}</div><div class="fm-file-name" title="${esc(x.name)}">${esc(x.name||'Unnamed file')}</div><div class="fm-file-title" title="${esc(x.title||'')}">${esc(x.title||x.type||'Uploaded file')}</div><div style="margin-top:9px"><span class="fm-badge" title="${esc(x.storage)}">${esc(x.storage||'Unknown storage')}</span></div><div class="fm-meta"><span>${size(x.size)}</span><span>${esc(String(x.created_at||'').slice(0,10)||'—')}</span></div><div class="fm-actions"><button class="btn secondary" data-open="${esc(x.download_url)}" data-name="${esc(x.name)}">Open</button><button class="btn danger" data-delete="${esc(x.id)}" data-name="${esc(x.name)}">Delete</button></div></article>`}).join('')||'<div class="fm-empty"><strong>No files found</strong>Try a different search or filter.</div>';
    }
    async function load(){grid.innerHTML='<div class="fm-empty"><strong>Loading files…</strong>Fetching your file inventory.</div>';try{const result=await Api.get('/admin/all-files');rows=Array.isArray(result)?result:(result?.items||[]);document.getElementById('total-count').textContent=rows.length;document.getElementById('r2-count').textContent=rows.filter(x=>String(x.storage).toLowerCase().includes('r2')).length;document.getElementById('total-size').textContent=size(rows.reduce((sum,x)=>sum+(Number(x.size)||0),0));draw()}catch(e){grid.innerHTML=`<div class="fm-error">${esc(e.message||'Could not load files. Please sign in again and refresh.')}</div>`}}
    async function authorizedFetch(url,options={}){const token=localStorage.getItem('rmcti_token')||sessionStorage.getItem('token');const headers={...(options.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};return fetch(url,{...options,headers})}
    grid.addEventListener('click',async e=>{const open=e.target.closest('[data-open]'),del=e.target.closest('[data-delete]');if(open){try{const path=open.dataset.open;const res=await authorizedFetch(path.startsWith('/api')?path:'/api'+path);if(!res.ok)throw Error('Could not open this file');const blob=await res.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=open.dataset.name||'download';a.target='_blank';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(err){alert(err.message)}return}if(del){const id=del.dataset.delete,name=del.dataset.name||'this file';if(!confirm(`Delete “${name}” permanently from RMCTI and R2, if stored there?`))return;del.disabled=true;try{const res=await authorizedFetch('/api/admin/all-files/'+id,{method:'DELETE'});const data=await res.json().catch(()=>({}));if(!res.ok||data.success===false)throw Error(data.message||'Could not delete file');rows=rows.filter(x=>x.id!==id);document.getElementById('total-count').textContent=rows.length;document.getElementById('r2-count').textContent=rows.filter(x=>String(x.storage).toLowerCase().includes('r2')).length;document.getElementById('total-size').textContent=size(rows.reduce((sum,x)=>sum+(Number(x.size)||0),0));draw()}catch(err){alert(err.message);del.disabled=false}}});
    search.addEventListener('input',draw);filter.addEventListener('change',draw);document.getElementById('refresh').addEventListener('click',load);await load();
  })();
  </script>
</body></html>
