<!doctype html><html lang="en"><head><link rel="icon" href="/favicon.ico"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RMCTI · All Files</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/global.css"></head><body data-role="admin"><div class="app"><aside class="side"><div class="brand"><img class="brandlogo" src="../asset/image.png" alt="RMCTI logo"><span>RMCTI</span></div><nav class="nav"><a href="dashboard.html">⌂ Dashboard</a><a href="attachments.html">📎 Attach File</a><a href="all-files.html">🗂 All Files</a><a href="students.html">♧ Students</a><a href="teachers.html">♙ Teachers</a><button type="button" data-theme>◐ Theme</button><button type="button" data-logout>↪ Logout</button></nav></aside><main class="main"><header class="top"><div><button class="btn secondary menu" data-menu>☰</button> <b>All Files</b></div><span class="muted" data-user></span></header><section class="content"><h1>All Files</h1><p class="muted">A file-manager view of files uploaded to RMCTI and their storage location.</p><div class="card pad"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><input class="input" id="search" placeholder="Search name, type or MIME type" style="max-width:380px"><button class="btn secondary" id="refresh">Refresh</button><span class="muted" id="count"></span></div><div style="overflow:auto;margin-top:16px"><table class="table"><thead><tr><th>File</th><th>Type</th><th>Size</th><th>Storage</th><th>Uploaded</th><th>Action</th></tr></thead><tbody id="files"><tr><td colspan="6">Loading files…</td></tr></tbody></table></div></div></section></main></div><script src="../js/theme.js"></script><script src="../js/api.js"></script><script src="../js/utils.js"></script><script src="../js/auth.js"></script><script src="../js/app.js"></script><script>
(async()=>{const body=document.getElementById('files'),search=document.getElementById('search'),count=document.getElementById('count');let rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const size=n=>n<1024?`${n||0} B`:n<1048576?`${(n/1024).toFixed(1)} KB`:`${(n/1048576).toFixed(2)} MB`;function draw(){const q=search.value.toLowerCase();const a=rows.filter(x=>[x.name,x.title,x.type,x.mime_type,x.storage].join(' ').toLowerCase().includes(q));count.textContent=`${a.length} file(s)`;body.innerHTML=a.map(x=>`<tr><td><strong>${esc(x.name)}</strong><div class="muted">${esc(x.title||'')}</div></td><td>${esc(x.type)}<div class="muted">${esc(x.mime_type)}</div></td><td>${size(Number(x.size))}</td><td>${esc(x.storage)}</td><td>${esc(x.created_at||'—')}</td><td><button class="btn secondary small" data-open="${esc(x.download_url)}">Open / Download</button></td></tr>`).join('')||'<tr><td colspan="6">No matching files.</td></tr>';}async function load(){body.innerHTML='<tr><td colspan="6">Loading…</td></tr>';try{rows=await Api.get('/admin/all-files');draw()}catch(e){body.innerHTML=`<tr><td colspan="6">${esc(e.message)}</td></tr>`}}body.addEventListener('click',async e=>{const path=e.target.closest('[data-open]')?.dataset.open;if(!path)return;try{const token=localStorage.getItem('rmcti_token')||sessionStorage.getItem('token');const res=await fetch(path.startsWith('/api')?path:'/api'+path,{headers:{Authorization:'Bearer '+token}});if(!res.ok)throw Error('Could not open file');const blob=await res.blob(),url=URL.createObjectURL(blob);window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(err){alert(err.message)}});search.addEventListener('input',draw);document.getElementById('refresh').onclick=load;await load()})();</script></body></html>
