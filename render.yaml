services:
  - type: web
    name: rmcti-site
    runtime: static
    region: singapore
    plan: free
    buildCommand: ""
    staticPublishPath: frontend
    routes:
      - type: rewrite
        source: /api/*
        destination: https://rmcti.onrender.com/api/*
      - type: rewrite
        source: /health
        destination: https://rmcti.onrender.com/health
    autoDeployTrigger: commit
  - type: web
    name: rmcti
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/migrate.py
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 --keep-alive 5 backend.app:app
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
