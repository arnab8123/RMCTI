services:
  - type: web
    name: rmcti
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/migrate.py
    startCommand: gunicorn --workers 2 --threads 4 --timeout 60 --keep-alive 5 --max-requests 1000 --max-requests-jitter 100 backend.app:app
    healthCheckPath: /health
    autoDeploy: true
